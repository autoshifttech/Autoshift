    posts:[
      { id:'b1', image:'post-workflows', status:'published', date:'2026-10-06', tag:'Automation', slug:'five-workflows-to-automate-before-you-hire', title:'Five workflows to automate before you hire again', excerpt:'Most small teams lose hours every week to the same five jobs. Here is where automation pays back fastest.',
        body:'Hiring is the usual answer to a busy team. Before you add headcount, check whether the work is repetitive enough for software to take over.\n\n## 1. Lead capture and first reply\nLeads arrive from forms, ads, WhatsApp and email. An automation can collect them in one place, reply within a minute and ask the two or three questions your sales team always asks.\n\n## 2. Appointment booking\nThe back-and-forth over time slots is pure overhead. Connect your calendar to WhatsApp or a voice agent and let customers pick a slot themselves, with reminders sent automatically.\n\n## 3. Follow-ups nobody remembers\nQuotes, unpaid invoices and post-sale check-ins slip when people are busy. A workflow can send the right message on the right day and log it in your CRM.\n\n## 4. Data entry between tools\nIf someone copies details from one app into another, that is an API integration waiting to happen.\n\n## 5. Internal questions\nNew staff ask the same questions about pricing, policies and processes. A knowledge assistant trained on your documents answers them with sources.\n\n## Where to start\nPick the workflow that happens most often and costs the most time. Automate that one end to end, measure the hours saved, then move to the next.' },
      { id:'b2', image:'post-channels', status:'published', date:'2026-10-13', tag:'AI agents', slug:'whatsapp-agent-or-website-chatbot', title:'WhatsApp agent or website chatbot? How to choose', excerpt:'Both answer customer questions. They suit different businesses, and picking the wrong one wastes the build.',
        body:'A website chatbot meets visitors while they browse. A WhatsApp agent meets customers where they already talk to you.\n\n## Choose a website chatbot when\n- Most of your leads come from search and your website\n- Visitors need product details before they buy\n- You want answers on every page, without a phone number\n\n## Choose a WhatsApp agent when\n- Customers already message you on WhatsApp\n- You send reminders, order updates or quotes\n- Conversations continue over days, not minutes\n\n## Or use both\nThe same knowledge base and the same agent can answer on both channels. You maintain one source of truth and reach customers on either.' },
      { id:'b3', image:'svc-whatsapp-communication', status:'published', date:'2026-10-12', tag:'WhatsApp', slug:'how-to-automate-whatsapp-replies-for-your-clinic', title:'How to automate WhatsApp replies for your clinic', excerpt:'Patients message at all hours about timings, fees and appointments. Here is how to answer every one of them without adding staff.',
        body:'Most clinics already get more WhatsApp messages than calls. The problem is that the front desk answers them between patients, so replies take hours and some never happen.\n\n## What patients actually ask\nLook at your last 50 WhatsApp chats. You will usually find the same handful of questions.\n\n- Is the doctor available today?\n- What are the consultation fees?\n- Where are you located, and is there parking?\n- Can I book, move or cancel an appointment?\n- Are my reports ready?\n\nEvery one of these can be answered automatically.\n\n## Step 1: Move to the WhatsApp Business API\nThe free WhatsApp Business app is built for one person on one phone. The official Business API lets software reply for you, connect to your calendar and hand chats to staff when needed.\n\n## Step 2: Write down your answers once\nCollect timings, fees, doctor schedules, location and your rescheduling policy in one document. The assistant answers only from this, so it never makes things up.\n\n## Step 3: Connect your calendar\nWhen a patient asks to book, the assistant offers real open slots, books the one they pick and sends a confirmation.\n\n## Step 4: Add reminders\nA reminder the day before and a few hours before cuts no-shows, and gives patients an easy way to reschedule instead of simply not coming.\n\n## Step 5: Keep a person in the loop\nAnything medical, urgent or unusual goes straight to your staff with the full conversation, so the patient never repeats themselves.\n\n## What it takes\nA typical clinic setup goes live in one to two weeks. If you want to see where your clinic would save the most time, book a free automation audit.' },
      { id:'b4', image:'svc-ai-voice-agents', status:'published', date:'2026-10-10', tag:'Voice agents', slug:'what-an-ai-voice-receptionist-can-and-cant-do', title:'What an AI voice receptionist can (and can’t) do for your business', excerpt:'Voice agents now sound natural and book appointments on their own. Here is an honest look at where they work well and where a person is still better.',
        body:'An AI voice receptionist answers your phone, understands what the caller wants and takes action: booking a slot, answering a question or passing the call to your team.\n\n## Where voice agents work well\n- Answering every call, including lunch breaks, evenings and weekends\n- Booking, moving and cancelling appointments in your calendar\n- Answering common questions about prices, timings and location\n- Qualifying new enquiries and sending your team a summary\n- Calling back missed calls and leads who asked for a call\n\n## Where a person is still better\n- Complaints and emotional conversations\n- Complex negotiations and custom quotes\n- Anything that needs judgement your business has not written down\n\nA good setup handles the routine calls and hands the rest to a person, with a summary so the caller does not have to repeat themselves.\n\n## What you need to start\n- A phone number the agent can answer (new or forwarded)\n- Your calendar or booking system\n- Your common questions and answers, written down once\n\n## How to judge one\nCall it yourself. Try to book, change the time, ask something unusual and ask for a person. If it handles all four calmly, it is ready for your customers.\n\nWant to hear one working? Ask us for a demo call, or book a free automation audit to see whether a voice agent fits your business.' },
      { id:'b5', image:'proj-realestate', status:'published', date:'2026-10-08', tag:'Real estate', slug:'how-real-estate-teams-can-reply-to-every-lead-in-5-minutes', title:'How real-estate teams can reply to every lead in under 5 minutes', excerpt:'Property leads cool off fast. A simple WhatsApp workflow can reply, qualify and book site visits before a competitor calls back.',
        body:'Real-estate leads arrive from ads, portals, your website and walk-ins, often late at night. By the time someone calls back the next morning, the buyer has already spoken to two other agents.\n\n## The five-minute workflow\n- **Capture:** every lead from every source lands in one place automatically\n- **Reply:** a WhatsApp message goes out within a minute, using the buyer’s name and the property they asked about\n- **Qualify:** the assistant asks budget, preferred location and when they plan to buy\n- **Book:** qualified buyers pick a site-visit slot from your team’s calendar\n- **Hand off:** your agent gets a short summary before they call\n\n## Why WhatsApp works for property\nBuyers already use it, they can share photos and locations easily, and conversations continue over days, which suits how property decisions are made.\n\n## Keep it human\nThe assistant should introduce itself honestly, answer only from your listing details and pass the conversation to an agent whenever a buyer asks for one.\n\n## What to measure\nTrack time to first reply, the share of leads that get qualified and the number of site visits booked each week. Those three numbers show quickly whether the workflow is paying for itself.\n\nWant this set up for your team? Book a free automation audit and we will map your lead sources with you.' }

function md(src){

    b = b.trim(); if (!b) return '';

    if (lines.every(l => /^- /.test(l))) return '<ul>' + lines.map(l => '<li>' + inl(l.slice(2)) + '</li>').join('') + '</ul>';
    if (/^## /.test(lines[0])){

      return '<h2>' + inl(lines[0].slice(3)) + '</h2>' + (rest.length ? (bullets ? '<ul>' + rest.map(l => '<li>' + inl(l.slice(2)) + '</li>').join('') + '</ul>' : '<p>' + inl(rest.join(' ')) + '</p>') : '');
    }
    return '<p>' + inl(lines.join(' ')) + '</p>';
  }).join('');
}

function initSmoothScroll(){

  const inner = el => { for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement){ if (el.matches && el.matches('textarea, select, .mega, .mnav')) return true; const o = getComputedStyle(el).overflowY; if ((o === 'auto' || o === 'scroll') && el.scrollHeight > el.clientHeight + 2) return true; } return false; };

async function postWebhook(url, entry){

}
async function saveLead(entry){
  const d = PUBLISHED;

  let saved = false;

    try {
      const ref = caps.db.doc('leads/' + caps.uid);
      const snap = await ref.get();
      const prev = snap.exists ? snap.data() : {};
      const msgs = (Array.isArray(prev.messages) ? prev.messages.slice(-19) : []).concat([entry]);
      await ref.set({ messages:msgs, status:'new', updatedAt:entry.at, name:entry.name, email:entry.email || prev.email || '', phone:entry.phone || prev.phone || '', company:entry.company || prev.company || '', source:entry.source || '' });

/* AutoShift · mailer.js
   Makes enquiry emails reliable. The site posts each lead to the "Lead delivery link" set in the admin panel.
   When that link is a FormSubmit address, this layer sends it the way FormSubmit's AJAX API expects
   (JSON, readable reply, clear field names, a subject line, no captcha step), so every form reaches the inbox.
   Other delivery links (Formspree, Google Sheets, Zapier, Make) are left exactly as they were. */
(function(){
  'use strict';
  if (typeof window.fetch !== 'function' || window.__axMailer) return; window.__axMailer = true;
  var nativeFetch = window.fetch.bind(window);
  var LABELS = { name:'Name', phone:'WhatsApp / phone', email:'Email', company:'Company', service:'Service', timeline:'Timeline', message:'Message', source:'Form', page:'Page', utm:'Came from', at:'Sent at' };
  function isFormSubmit(u){ try { return new URL(String(u)).hostname.replace(/^www\./, '') === 'formsubmit.co'; } catch(e){ return false; } }
  function ajaxUrl(u){ var x = new URL(String(u)); if (!/^\/ajax\//.test(x.pathname)) x.pathname = '/ajax' + x.pathname; return x.toString(); }
  window.fetch = function(input, init){

    if (!isFormSubmit(url) || !init || !(init.body instanceof FormData)) return nativeFetch(input, init);
    var src = {}; init.body.forEach(function(v, k){ src[k] = String(v); });
    var out = { _subject:'New enquiry from the AutoShift website' + (src.name ? ' · ' + src.name : ''), _template:'table', _captcha:'false' };
    if (src.email && /@/.test(src.email)) out._replyto = src.email;
    Object.keys(LABELS).forEach(function(k){ var v = (src[k] || '').trim(); if (!v) return; if (k === 'at'){ try { v = new Date(v).toLocaleString('en-IN', { timeZone:'Asia/Kolkata' }) + ' IST'; } catch(e){} } out[LABELS[k]] = v; });
    return nativeFetch(ajaxUrl(url), { method:'POST', mode:'cors', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body:JSON.stringify(out), signal:init.signal })
      .then(function(res){
        res.clone().json().then(function(j){
          var ok = j && String(j.success) === 'true';
          try { sessionStorage.setItem('as-mail', ok ? 'sent' : 'not-sent: ' + (j && j.message || res.status)); } catch(e){}
          if (!ok && window.console) console.warn('[AutoShift] Enquiry email not sent yet:', j && j.message);
        }).catch(function(){});

      });
  };
})();
